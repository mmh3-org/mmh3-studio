[package]
name = "mmh3-studio"
default-run = "mmh3-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true

# The blocking client, the mock server and the thumbnail decoder need threads,
# sockets and files; Rune refuses its file dialogs on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
ureq.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "AbortSignal",
  "Blob",
  "DataTransfer",
  "Document",
  "DragEvent",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "File",
  "FileList",
  "FormData",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageData",
  "ImageOrientation",
  "MessageEvent",
  "Node",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ReadableStream",
  "RequestInit",
  "ResizeQuality",
  "Response",
  "Storage",
  "Window",
] }

[lints]
workspace = true
