[workspace]
# apps/ holds the programs; shared libraries go in crates/ and join the members
# once the first one exists, because a glob that matches nothing is an error.
members = ["apps/*"]
resolver = "3"

# Every workspace crate inherits these, so a version or edition bump is one edit.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependency specs. Crates opt in with `<dep>.workspace = true`.
[workspace.dependencies]
# Rune has no release yet, so every crate pins the same `dev` revision; the
# wgpu-hal patch below must come from that revision too.
rune = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }
image = { version = "0.25", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }
# NSProcessInfo for Low Power Mode and the thermal state; Rune already pulls it in.
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSProcessInfo",
] }
# The web build's bindings; Rune pins the same majors for its own web target.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The library is the app's own internals, not an API anyone else calls.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Layout and pixel code converts between screen-sized integers and floats on
# nearly every line; the values never approach the limits these lints guard.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The UI code names its state, kit and colours `s`, `k` and `c` throughout.
many_single_char_names = "allow"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "fa07f485dd52d8f66db317460566ef4dc4784821" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
